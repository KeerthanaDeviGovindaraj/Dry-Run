    - data_privacy_concerns: string (GDPR, CCPA, HIPAA if relevant)
    - ip_contract_notes: string
    - jurisdictional_issues: string
    - action_items: list of 1–5 concrete strings for the legal team
    - verdict: one sentence (max 200 chars)
    - confidence_score: float 0.0–1.0
    - revision_needed: bool
    - revision_reason: string (empty if false)

    Rate every risk. Be a risk-ranker not a blocker.
  expected_output: >
    A valid JSON object with all fields from the LegalMemo schema.
    No markdown fences. Pure JSON only.
  agent: legal_agent

sales_analysis_task:
  description: >
    Analyse this business problem as the CRO:

    PROBLEM: {problem}
    COMPANY CONTEXT: {company_context}

    You MUST respond with a JSON object matching this exact schema:
    - affected_customer_segments: list of strings
    - deal_size_impact: string with estimated $ impact
    - top_objections: list of up to 3 objections you will hear in the field
    - sales_motion: exactly one of "PLG", "direct_sales", "channel", "hybrid"
    - voice_of_customer: what customers actually want vs what we think
    - verdict: one sentence (max 200 chars)
    - confidence_score: float 0.0–1.0
    - revision_needed: bool
    - revision_reason: string (empty if false)

    Ground this in what you hear in the field, not what marketing says.
  expected_output: >
    A valid JSON object with all fields from the SalesMemo schema.
    No markdown fences. Pure JSON only.
  agent: sales_agent

devils_advocate_task:
  description: >
    You have received structured analysis memos from all 5 executives.
    Your job: attack the weakest assumption in each and surface hidden dissent.

    PROBLEM: {problem}

    You have access to the outputs of:
    - CTO Analysis
    - CMO Analysis
    - CFO Analysis
    - Legal Analysis
    - Sales Analysis
    Review those outputs and identify contradictions,
    weak assumptions, hidden risks, and disagreements.

    You MUST respond with a JSON object matching this exact schema:
    - cto_weakest_claim: string — their weakest claim + why it could be wrong
    - cmo_weakest_claim: string
    - cfo_weakest_claim: string
    - legal_weakest_claim: string
    - sales_weakest_claim: string
    - elephant_in_room: string — the thing nobody said but everyone should worry about
    - unanswered_question: string — the one question nobody wants to answer
    - dissent_detected: bool — true if material disagreement exists between memos
    - dissenting_agents: list of agent role names that conflict with consensus
    - confidence_score: float 0.0–1.0

    Look specifically at the verdicts across all 5 memos.
    If two or more contradict each other, dissent_detected must be true.
  expected_output: >
    A valid JSON object with all fields from the DevilsBrief schema.
    No markdown fences. Pure JSON only.
  agent: devils_advocate_agent

ceo_synthesis_task:
  description: >
    You are the CEO. You have all executive memos and the Devil's Advocate brief.
    Make the final call. Be decisive.

    PROBLEM: {problem}
    COMPANY CONTEXT: {company_context}
    You have access to:
    - CTO analysis
    - CMO analysis
    - CFO analysis
    - Legal analysis
    - Sales analysis
    - Devil's Advocate brief
    Review all prior outputs and make the final decision.

    You MUST respond with a JSON object matching this exact schema:
    - executive_summary: string, max 3 sentences
    - decision: string, clear unambiguous recommendation
    - key_rationale: list of exactly 3 strings, each citing a specific exec input
    - minority_report: object with:
        strongest_counterargument: string
        agents_who_dissented: list of strings
        why_overridden: string — explicit reason for overriding
        conditions_for_reversal: string — what evidence would change this
    - action_items: list of min 5 objects each with owner, action, deadline
    - risk_register: list of 3–5 objects each with description, severity, mitigation
    - success_metrics: list of min 3 strings — how we know in 90 days this was right
    - consensus_score: float 0.0–1.0 based on exec agreement you observed
    - ceo_confidence: float 0.0–1.0

    If revision_history contains prior rounds, explain what changed.
    Never leave minority_report empty — even unanimous decisions have a devil's case.
  expected_output: >
    A valid JSON object with all fields from the DecisionPacket schema.
    No markdown fences. Pure JSON only.
  agent: ceo_agent
