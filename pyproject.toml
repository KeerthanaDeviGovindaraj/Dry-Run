[project]
name = "ghostco"
version = "0.1.0"
description = "GhostCo — multi-agent AI boardroom simulation"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.11,<3.14"
dependencies = [
    "crewai[tools]>=0.130.0,<2.0.0",
    "crewai-tools>=0.40.0",
    "streamlit>=1.40.0,<2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0,<3.0.0",
    "pandas>=2.0.0",
    "openai>=1.40.0",
]

[project.scripts]
ghostco = "main:run"

[tool.setuptools]
packages = ["ghostco"]
package-dir = { "" = "src" }
py-modules = ["main"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.crewai]
type = "crew"
