<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" font-family="-apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B4BE0"/><stop offset="0.55" stop-color="#7C5CFF"/><stop offset="1" stop-color="#9b6bff"/>
    </linearGradient>
  </defs>
  <rect width="960" height="620" fill="#F6F7FB"/>

  <!-- Hero -->
  <rect x="24" y="20" width="912" height="66" rx="16" fill="url(#hero)"/>
  <text x="48" y="52" font-size="26">🧭</text>
  <text x="84" y="50" fill="#fff" font-size="20" font-weight="700">Dry Run</text>
  <text x="84" y="70" fill="#EAE6FF" font-size="12">Pressure-test a product decision before the review — and know what you still need to validate.</text>

  <!-- Tabs -->
  <g font-size="13" font-weight="600">
    <rect x="24" y="100" width="130" height="30" rx="7" fill="#fff" stroke="#E7E9F0"/>
    <text x="36" y="120" fill="#10121A">📋 Decision brief</text>
    <text x="172" y="120" fill="#5B6172">🎤 Review prep</text>
    <text x="286" y="120" fill="#5B6172">🗣️ Debate</text>
    <text x="372" y="120" fill="#5B6172">👥 Stakeholders</text>
    <text x="500" y="120" fill="#5B6172">📊 Metrics</text>
  </g>

  <!-- Decision under review -->
  <rect x="24" y="146" width="912" height="34" rx="8" fill="#F6F7FB" stroke="#5B4BE0" stroke-width="0" />
  <rect x="24" y="146" width="4" height="34" fill="#5B4BE0"/>
  <text x="40" y="167" font-size="12" fill="#10121A"><tspan font-weight="700">Decision under review: </tspan>Replace sales-assisted SMB onboarding with self-serve next quarter?</text>

  <!-- Strength badge -->
  <rect x="24" y="196" width="310" height="26" rx="13" fill="#FCEBD6"/>
  <text x="38" y="213" font-size="12" font-weight="700" fill="#B5700A">≈ Conditional — rests on unvalidated assumptions</text>

  <!-- Recommendation -->
  <text x="24" y="250" font-size="18" font-weight="750" fill="#10121A">Ship self-serve for SMB, gated on a validation phase.</text>
  <text x="24" y="272" font-size="13" fill="#5B6172">Do not cut sales-assisted onboarding until the self-serve cohort proves out on activation.</text>

  <!-- Metric tiles -->
  <g>
    <rect x="24" y="290" width="292" height="60" rx="12" fill="#fff" stroke="#E7E9F0"/>
    <text x="40" y="322" font-size="24" font-weight="750" fill="#10121A">80%</text>
    <text x="40" y="340" font-size="10" fill="#5B6172" letter-spacing="1">STAKEHOLDER ALIGNMENT</text>

    <rect x="334" y="290" width="292" height="60" rx="12" fill="#fff" stroke="#E7E9F0"/>
    <text x="350" y="322" font-size="24" font-weight="750" fill="#10121A">75%</text>
    <text x="350" y="340" font-size="10" fill="#5B6172" letter-spacing="1">CONFIDENCE</text>

    <rect x="644" y="290" width="292" height="60" rx="12" fill="#fff" stroke="#E7E9F0"/>
    <text x="660" y="322" font-size="24" font-weight="750" fill="#10121A">2/3</text>
    <text x="660" y="340" font-size="10" fill="#5B6172" letter-spacing="1">ASSUMPTIONS TO VALIDATE</text>
  </g>

  <!-- The case against -->
  <text x="24" y="384" font-size="12" font-weight="700" letter-spacing="1" fill="#5B6172">⚔️ THE CASE AGAINST</text>
  <rect x="24" y="394" width="912" height="40" rx="12" fill="#FFF6F5" stroke="#F2C0BC"/>
  <text x="40" y="419" font-size="13" fill="#10121A">Sales-onboarded SMB churn is 6%/mo [given]; self-serve could run higher without a human touchpoint.</text>

  <!-- Assumptions to validate -->
  <text x="24" y="466" font-size="12" font-weight="700" letter-spacing="1" fill="#5B6172">🔎 ASSUMPTIONS TO VALIDATE</text>
  <rect x="24" y="476" width="912" height="56" rx="12" fill="#FFFaf0" stroke="#F2D7A0"/>
  <text x="40" y="498" font-size="13" fill="#10121A"><tspan font-weight="700">⚠️ UNVALIDATED</tspan> — Self-serve matches sales-assisted activation (38%). · Exec Sponsor</text>
  <text x="40" y="518" font-size="12" fill="#5B6172"><tspan font-weight="700">How to validate:</tspan> A/B a self-serve cohort for 4 weeks before full rollout.</text>

  <!-- Open questions -->
  <text x="24" y="564" font-size="12" font-weight="700" letter-spacing="1" fill="#5B6172">❓ RESOLVE BEFORE COMMITTING</text>
  <rect x="24" y="574" width="912" height="30" rx="12" fill="#fff" stroke="#E7E9F0"/>
  <text x="40" y="593" font-size="13" font-weight="650" fill="#10121A">Do existing enterprise contracts guarantee human onboarding?</text>
</svg>
